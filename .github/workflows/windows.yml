name: Windows
on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build x64 portable app
        shell: pwsh
        run: |
          python scripts/check-windows-localization.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization check failed' }
          ./scripts/build-windows.ps1
      - name: Core, native Recycle Bin, WPF and Task Scheduler tests
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Executable codex-work/dist/Spacekeeper-win-x64/Spacekeeper.exe
      - name: Build ARM64 portable app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-arm64
      - name: Upload Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Spacekeeper-Windows
          path: |
            codex-work/dist/*.zip
            codex-work/dist/*.sha256
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-validation
          path: |
            codex-work/windows-ui-results/
            codex-work/windows-ui-*/errors.log
            codex-work/windows-schedule-*/schedule-result.txt
            codex-work/windows-schedule-*/errors.log
